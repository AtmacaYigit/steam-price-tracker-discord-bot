name: Steam Discount Tracker

on:
  schedule:
    # Her 4 saatte bir otomatik çalışır (UTC saatine göre)
    - cron: '0 */4 * * *'
  workflow_dispatch: # İstediğin zaman manuel çalıştırmak için buton ekler

jobs:
  track-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Botu Çalıştır
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python steam_tracker.py
