name: Steam Discount Tracker

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

# Repoya geri kayıt (commit) yapabilme izni
permissions:
  contents: write

jobs:
  track-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run tracker script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python steam_tracker.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracked_data.json
          git commit -m "chore: update tracked price state [skip ci]" || echo "No changes to commit"
          git push
